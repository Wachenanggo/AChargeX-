# Builds an installable Android debug APK on GitHub's Linux runners — no computer needed.
# Run it from GitHub → Actions → "Android APK" → Run workflow, then download the artifact.
# Set repository variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables)
# to your AChargeX server URL, e.g. https://achargex.onrender.com
name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Build web app
        run: npm run build -w @achargex/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Add Android platform and sync
        working-directory: apps/web
        run: |
          npx cap add android
          npx cap sync android
      - name: Gradle assembleDebug
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: achargex-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
