<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find (map)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;display:flex;justify-content:center;padding:24px}
a{color:#007A55}a:hover{color:#192338}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF3F0; font-family: Inter, sans-serif; color: #192338; position: relative; overflow: hidden">

  <!-- map -->
  <svg role="img" aria-label="Map of nearby charging stations" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#EEF3F0"></rect>
    <path d="M40 300 L150 280 L170 380 L60 400 Z" fill="#D7EDE0"></path>
    <path d="M250 520 L360 500 L380 600 L270 620 Z" fill="#D7EDE0"></path>
    <path d="M200 240 L300 230 L310 300 L210 310 Z" fill="#FBF5E2"></path>
    <path d="M70 470 L180 455 L190 540 L80 555 Z" fill="#FBF5E2"></path>
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <path d="M-20 260 L420 200" stroke-width="14"></path>
      <path d="M-20 450 L420 400" stroke-width="10"></path>
      <path d="M-20 640 L420 590" stroke-width="12"></path>
      <path d="M120 150 L200 760" stroke-width="12"></path>
      <path d="M300 150 L350 760" stroke-width="9"></path>
      <path d="M20 180 L60 760" stroke-width="7"></path>
      <path d="M200 330 Q260 380 340 350" stroke-width="6"></path>
    </g>
    <text x="236" y="276" font-family="Inter" font-size="10" fill="#7C8CA1" font-weight="600" letter-spacing="1">LANANG</text>
    <text x="80" y="520" font-family="Inter" font-size="10" fill="#7C8CA1" font-weight="600" letter-spacing="1">BUHANGIN</text>
  </svg>

  <!-- clusters + pins -->
  <div style="position: absolute; left: 52px; top: 322px; width: 44px; height: 44px; border-radius: 22px; background: #BFF0DC; border: 3px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #005E42">12</div>
  <div style="position: absolute; left: 286px; top: 440px; width: 44px; height: 44px; border-radius: 22px; background: #BFF0DC; border: 3px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #005E42">7</div>

  <div style="position: absolute; left: 228px; top: 300px; width: 40px; height: 40px; border-radius: 20px 20px 20px 4px; transform: rotate(-45deg); background: #007A55; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 4px 10px rgba(25,35,56,.25)"></div>
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" style="position: absolute; left: 240px; top: 312px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>

  <div style="position: absolute; left: 110px; top: 400px; width: 40px; height: 40px; border-radius: 20px 20px 20px 4px; transform: rotate(-45deg); background: #C2413B; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 4px 10px rgba(25,35,56,.25)"></div>
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" style="position: absolute; left: 122px; top: 412px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>

  <div style="position: absolute; left: 176px; top: 496px; width: 52px; height: 52px; border-radius: 26px 26px 26px 6px; transform: rotate(-45deg); background: #00BF80; border: 4px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 6px 16px rgba(0,122,85,.4)"></div>
  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#192338" style="position: absolute; left: 192px; top: 512px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
  <div style="position: absolute; left: 216px; top: 488px; width: 22px; height: 22px; border-radius: 11px; background: #F2B53A; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>
  </div>

  <div style="position: absolute; left: 92px; top: 600px; width: 18px; height: 18px; border-radius: 9px; background: #2F6FED; border: 3px solid #FFFFFF; box-shadow: 0 0 0 10px rgba(47,111,237,.18)"></div>

  <!-- top chrome -->
  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px">
        <span style="display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: #00BF80; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#192338"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span>ACharge<span style="color: #007A55">X</span></span>
      </div>
      <button type="button" aria-label="Support" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #192338; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"></path><path d="M18 17a4 4 0 0 1-4 4h-2"></path></svg>
      </button>
    </div>

    <a href="#" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E1EAF0; border-radius: 16px; padding: 10px 14px; text-decoration: none; color: #192338; box-shadow: 0 2px 8px rgba(25,35,56,.06)">
      <span style="width: 48px; height: 32px; border-radius: 8px; background: #EDF3F7; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="#192338" stroke-width="1.6"><path d="M2 13h30M4 13l3-6c1-2 3-3 5-3h9c2 0 4 1 5 3l3 6"></path><circle cx="9" cy="14" r="2.5" fill="#FFFFFF"></circle><circle cx="25" cy="14" r="2.5" fill="#FFFFFF"></circle></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 11px; letter-spacing: 1.4px; color: #5E6F86; font-weight: 600">CURRENT VEHICLE</span>
        <span style="font-size: 15px; font-weight: 600">GAC Aion UT · CCS2 / Type 2</span>
      </span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 46px; background: #FFFFFF; border: 1px solid #E1EAF0; border-radius: 14px; padding: 0 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6F86" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="text" placeholder="Where do you want to charge?" aria-label="Search stations" style="border: 0; outline: none; font-family: Inter, sans-serif; font-size: 14px; width: 100%; color: #192338; background: transparent">
      </label>
      <button type="button" aria-label="List view" style="width: 46px; height: 46px; border-radius: 14px; border: 1px solid #E1EAF0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      </button>
    </div>

    <div style="display: flex; gap: 8px; overflow: hidden">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #192338; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap">All stations</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E1EAF0; background: #FFFFFF; color: #192338; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 4px; background: #00BF80"></span>Available</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E1EAF0; background: #FFFFFF; color: #192338; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap">My connectors</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E1EAF0; background: #FFFFFF; color: #192338; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Filters</button>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 278px; background: #192338; color: #FFFFFF; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; padding: 4px 8px; border-radius: 6px">DEMO DATA</div>
  <button type="button" aria-label="Recenter on my location" style="position: absolute; right: 16px; top: 548px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E1EAF0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(25,35,56,.1)">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v4M12 19v4M1 12h4M19 12h4"></path></svg>
  </button>

  <!-- selected station preview -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 98px; background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(25,35,56,.16); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #E3F8EF; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#007A55"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 16px; font-weight: 700">Matina Crossing Hub</span><span style="font-size: 10px; font-weight: 700; color: #7A5300; background: #FDF1D6; padding: 2px 6px; border-radius: 6px">DEAL</span></span>
        <span style="font-size: 13px; color: #5E6F86">Quimpo Blvd, Matina · 3.4 km</span>
      </span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: 1px solid #E1EAF0; padding-top: 12px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10px; letter-spacing: 1.2px; color: #5E6F86; font-weight: 600">PRICE/KWH</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">₱33.50</span></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10px; letter-spacing: 1.2px; color: #5E6F86; font-weight: 600">AVAILABLE</span><span style="font-size: 15px; font-weight: 700; color: #007A55">2 of 2</span></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 10px; letter-spacing: 1.2px; color: #5E6F86; font-weight: 600">OUTPUT</span><span style="font-size: 15px; font-weight: 700">DC 60kW</span></span>
    </div>
  </div>

  <!-- bottom nav -->
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E1EAF0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; padding-top: 10px; box-sizing: border-box">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Home</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #192338; font-size: 11px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Find</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #192338; font-size: 11px; font-weight: 700; margin-top: -30px"><span style="width: 58px; height: 58px; border-radius: 29px; background: #00BF80; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,191,128,.45); border: 4px solid #FFFFFF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"></path><rect x="7" y="7" width="4" height="4"></rect><rect x="13" y="7" width="4" height="4"></rect><rect x="7" y="13" width="4" height="4"></rect><path d="M14 14h3v3"></path></svg></span>Scan</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14h18M5 14l2.5-5.5A3 3 0 0 1 10.2 7h3.6a3 3 0 0 1 2.7 1.5L19 14v4H5z"></path><circle cx="8" cy="18" r="1.5"></circle><circle cx="16" cy="18" r="1.5"></circle></svg>Garage</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Wallet</a>
  </nav>
</div>
</body>
</html>
