<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;display:flex;justify-content:center;padding:24px}
a{color:#007A55}a:hover{color:#192338}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F9F6; font-family: Inter, sans-serif; color: #192338; position: relative; overflow: hidden">
  <div style="background: #192338; color: #FFFFFF; padding: 16px 16px 56px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Garage</h1>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
    </div>
    <p style="margin: 6px 0 0; font-size: 13px; color: #9FB0C8">We filter stations by your selected vehicle's connectors.</p>
  </div>

  <div style="margin: -40px 16px 0; background: #FFFFFF; border-radius: 22px; border: 1px solid #E1EAF0; box-shadow: 0 8px 24px rgba(25,35,56,.08); padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #005E42; background: #DDF6EB; padding: 4px 8px; border-radius: 8px">SELECTED</span>
      <button type="button" aria-label="Edit vehicle" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
    </div>
    <div style="height: 110px; display: flex; align-items: center; justify-content: center; background: #F4F9F6; border-radius: 16px">
      <svg role="img" aria-label="Compact hatchback illustration" width="210" height="86" viewBox="0 0 210 86">
        <ellipse cx="105" cy="78" rx="92" ry="6" fill="#192338" opacity="0.08"></ellipse>
        <path d="M14 62 L20 44 Q24 36 34 34 L62 30 Q78 14 100 12 L140 12 Q158 12 170 28 L188 34 Q198 38 198 50 L198 62 Z" fill="#E9E4DA" stroke="#192338" stroke-width="2" stroke-linejoin="round"></path>
        <path d="M70 30 Q84 18 100 18 L118 18 L118 32 Z" fill="#2A3A55"></path>
        <path d="M124 18 L140 18 Q152 18 162 30 L124 32 Z" fill="#2A3A55"></path>
        <path d="M14 62 L198 62" stroke="#192338" stroke-width="2"></path>
        <rect x="178" y="40" width="16" height="6" rx="3" fill="#00BF80"></rect>
        <circle cx="54" cy="64" r="14" fill="#192338"></circle><circle cx="54" cy="64" r="6" fill="#9FB0C8"></circle>
        <circle cx="158" cy="64" r="14" fill="#192338"></circle><circle cx="158" cy="64" r="6" fill="#9FB0C8"></circle>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 700">GAC Aion UT BEV 44</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5E6F86">ABC 1234 · 44 kWh battery</span>
    </div>
    <div style="display: flex; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; background: #EDF3F7; padding: 6px 10px; border-radius: 14px">TYPE 2 · AC</span>
      <span style="font-size: 12px; font-weight: 600; background: #EDF3F7; padding: 6px 10px; border-radius: 14px">CCS2 · DC</span>
    </div>
  </div>

  <div style="padding: 20px 16px 8px; display: flex; justify-content: space-between"><span style="font-size: 11px; letter-spacing: 1.4px; color: #5E6F86; font-weight: 600">CONNECTOR TYPES</span><span style="font-size: 12px; color: #5E6F86">Tap to change</span></div>
  <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
    <button type="button" style="height: 76px; border-radius: 14px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="10" r="1.5"></circle><circle cx="15" cy="10" r="1.5"></circle><circle cx="12" cy="15" r="1.5"></circle></svg><span style="font-size: 12px; font-weight: 700">TYPE 1</span><span style="font-size: 10px; color: #5E6F86">AC</span></button>
    <button type="button" aria-pressed="true" style="height: 76px; border-radius: 14px; border: 2px solid #00BF80; background: #E8F9F1; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007A55" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="10" r="1.3"></circle><circle cx="12" cy="9" r="1.3"></circle><circle cx="16" cy="10" r="1.3"></circle><circle cx="10" cy="14.5" r="1.3"></circle><circle cx="14" cy="14.5" r="1.3"></circle></svg><span style="font-size: 12px; font-weight: 700">TYPE 2</span><span style="font-size: 10px; color: #3E4C61">AC</span></button>
    <button type="button" style="height: 76px; border-radius: 14px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="9" r="1.3"></circle><circle cx="15" cy="9" r="1.3"></circle><circle cx="8" cy="13" r="1.3"></circle><circle cx="16" cy="13" r="1.3"></circle><circle cx="12" cy="15.5" r="1.3"></circle></svg><span style="font-size: 12px; font-weight: 700">GB/T AC</span><span style="font-size: 10px; color: #5E6F86">AC</span></button>
    <button type="button" style="height: 76px; border-radius: 14px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle></svg><span style="font-size: 12px; font-weight: 700">CHADEMO</span><span style="font-size: 10px; color: #5E6F86">DC</span></button>
    <button type="button" style="height: 76px; border-radius: 14px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="1.8"><circle cx="12" cy="9" r="6"></circle><rect x="7" y="16" width="10" height="5" rx="2.5"></rect></svg><span style="font-size: 12px; font-weight: 700">CCS1</span><span style="font-size: 10px; color: #5E6F86">DC</span></button>
    <button type="button" aria-pressed="true" style="height: 76px; border-radius: 14px; border: 2px solid #00BF80; background: #E8F9F1; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007A55" stroke-width="1.8"><circle cx="12" cy="9" r="6"></circle><rect x="7" y="16" width="10" height="5" rx="2.5"></rect><circle cx="10" cy="8" r="1"></circle><circle cx="14" cy="8" r="1"></circle></svg><span style="font-size: 12px; font-weight: 700">CCS2</span><span style="font-size: 10px; color: #3E4C61">DC</span></button>
  </div>

  <a href="#" style="margin: 14px 16px 0; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px dashed #C4CFDA; border-radius: 16px; padding: 14px; text-decoration: none; color: #192338">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #EDF3F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Add another vehicle</span><span style="font-size: 12px; color: #5E6F86">Switch between cars before you charge</span></span>
  </a>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E1EAF0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; padding-top: 10px; box-sizing: border-box">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Find</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #192338; font-size: 11px; font-weight: 700; margin-top: -30px"><span style="width: 58px; height: 58px; border-radius: 29px; background: #00BF80; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,191,128,.45); border: 4px solid #FFFFFF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"></path><rect x="7" y="7" width="4" height="4"></rect><rect x="13" y="7" width="4" height="4"></rect><rect x="7" y="13" width="4" height="4"></rect><path d="M14 14h3v3"></path></svg></span>Scan</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #192338; font-size: 11px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 14h18M5 14l2.5-5.5A3 3 0 0 1 10.2 7h3.6a3 3 0 0 1 2.7 1.5L19 14v4H5z"></path><circle cx="8" cy="18" r="1.5"></circle><circle cx="16" cy="18" r="1.5"></circle></svg>Garage</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5E6F86; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Wallet</a>
  </nav>
</div>
</body>
</html>
