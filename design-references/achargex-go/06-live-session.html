<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;display:flex;justify-content:center;padding:24px}
a{color:#7FE3BF}a:hover{color:#FFFFFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111A2B; font-family: Inter, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button type="button" aria-label="Minimize" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    <div style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px">
      <span style="display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: #00BF80; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#192338"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
      <span>ACharge<span style="color: #00BF80">X</span></span>
    </div>
    <button type="button" aria-label="Support" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"></path></svg></button>
  </div>

  <div style="margin: 4px 16px 0; background: #1A2640; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start">
    <span style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: #00BF80">CHARGING IN PROGRESS</span>
      <span style="font-size: 16px; font-weight: 600">Matina Crossing Hub</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9FB0C8">AX-MTN-B131-1 · CCS2</span>
    </span>
    <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.2px; background: #F2B53A; color: #192338; padding: 4px 7px; border-radius: 6px">DEMO</span>
  </div>

  <div style="position: relative; height: 330px; display: flex; align-items: center; justify-content: center">
    <svg role="img" aria-label="37 percent of the 500 peso limit used" width="290" height="290" viewBox="0 0 290 290">
      <circle cx="145" cy="145" r="138" fill="none" stroke="#1E2C47" stroke-width="1"></circle>
      <circle cx="145" cy="145" r="110" fill="none" stroke="#24344F" stroke-width="16"></circle>
      <circle cx="145" cy="145" r="110" fill="none" stroke="#00BF80" stroke-width="16" stroke-linecap="round" stroke-dasharray="256 691" transform="rotate(-90 145 145)"></circle>
      <circle cx="145" cy="145" r="86" fill="#00BF80" opacity="0.08"></circle>
    </svg>
    <div style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#00BF80"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; letter-spacing: -1px">5.56</span>
      <span style="font-size: 13px; color: #9FB0C8; font-weight: 500">kWh delivered</span>
    </div>
  </div>

  <div style="margin: 0 16px; background: #1A2640; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px">
      <span style="font-size: 15px; font-weight: 600">Charging at <span style="color: #00BF80">48.2 kW</span></span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #DCE4EF">00:12:17</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <div style="background: #111A2B; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 1.3px; color: #9FB0C8; font-weight: 600">ESTIMATED COST</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700">₱186.40</span></div>
      <div style="background: #111A2B; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 10px; letter-spacing: 1.3px; color: #9FB0C8; font-weight: 600">SPENDING LIMIT</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700">₱500.00</span></div>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 2px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9FB0C8" stroke-width="2" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      <span style="font-size: 12px; line-height: 1.5; color: #9FB0C8">Stops automatically at ₱500.00. Final total confirmed by the charger after you stop.</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 14px 16px 30px">
    <button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: 1.5px solid #3B4C6E; background: #1A2640; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>Stop charging</button>
  </div>
</div>
</body>
</html>
