<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charge setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;display:flex;justify-content:center;padding:24px}
a{color:#007A55}a:hover{color:#192338}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">Start charging</span>
    <button type="button" aria-label="Support" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #192338; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#192338" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"></path></svg></button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 16px">
    <span style="height: 5px; border-radius: 3px; background: #192338"></span>
    <span style="height: 5px; border-radius: 3px; background: #192338"></span>
    <span style="height: 5px; border-radius: 3px; background: #192338"></span>
    <span style="height: 5px; border-radius: 3px; background: #E1EAF0"></span>
  </div>

  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px">Set your limit</h1>
    <p style="margin: 0; font-size: 14px; color: #5E6F86">Charging stops automatically when it's reached.</p>
  </div>

  <div style="margin: 16px 16px 0; background: #F4F9F6; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#007A55"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 14px; font-weight: 700">Matina Crossing Hub</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5E6F86">AX-MTN-B131-1 · CCS2 · 60 kW</span>
    </span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700">₱33.50<span style="font-family: Inter, sans-serif; font-weight: 500; color: #5E6F86">/kWh</span></span>
  </div>

  <div style="padding: 18px 16px 8px"><span style="font-size: 11px; letter-spacing: 1.4px; color: #5E6F86; font-weight: 600">CHARGING LIMIT</span></div>
  <div style="padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px">
    <button type="button" style="height: 84px; border-radius: 16px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700">₱200</span><span style="font-size: 12px; color: #5E6F86">~6 kWh</span></button>
    <button type="button" aria-pressed="true" style="height: 84px; border-radius: 16px; border: 2px solid #00BF80; background: #E8F9F1; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700">₱500</span><span style="font-size: 12px; color: #3E4C61">~15 kWh</span></button>
    <button type="button" style="height: 84px; border-radius: 16px; border: 1.5px solid #E1EAF0; background: #FFFFFF; font-family: Inter, sans-serif; color: #192338; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 16px; font-weight: 700">Full</span><span style="font-size: 12px; color: #5E6F86">up to ₱1,500</span></button>
  </div>

  <div style="padding: 20px 16px 8px"><span style="font-size: 11px; letter-spacing: 1.4px; color: #5E6F86; font-weight: 600">PAY WITH</span></div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: center; gap: 12px; border: 2px solid #192338; border-radius: 16px; padding: 12px 14px; cursor: pointer">
      <span style="width: 40px; height: 28px; border-radius: 6px; background: #0B57D0; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">GC</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">GCash</span><span style="font-size: 12px; color: #5E6F86">Linked · ••• 4417</span></span>
      <input type="radio" name="pay" checked style="width: 20px; height: 20px; accent-color: #192338">
    </label>
    <label style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #E1EAF0; border-radius: 16px; padding: 12px 14px; cursor: pointer">
      <span style="width: 40px; height: 28px; border-radius: 6px; background: #0F8A5F; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">MY</span>
      <span style="flex: 1; font-size: 14px; font-weight: 600">Maya</span>
      <input type="radio" name="pay" style="width: 20px; height: 20px; accent-color: #192338">
    </label>
    <label style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #E1EAF0; border-radius: 16px; padding: 12px 14px; cursor: pointer">
      <span style="width: 40px; height: 28px; border-radius: 6px; background: #EDF3F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="16" viewBox="0 0 24 20" fill="none" stroke="#192338" stroke-width="2"><rect x="2" y="2" width="20" height="16" rx="2"></rect><path d="M2 7h20"></path></svg></span>
      <span style="flex: 1; font-size: 14px; font-weight: 600">Credit / debit card</span>
      <input type="radio" name="pay" style="width: 20px; height: 20px; accent-color: #192338">
    </label>
  </div>

  <div style="margin: 16px 16px 0; display: flex; gap: 10px; align-items: flex-start">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6F86" stroke-width="2" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
    <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5E6F86">We place a ₱500 hold. You're only charged for energy delivered; the unused amount is released after the session ends.</p>
  </div>

  <div style="margin-top: auto; padding: 14px 16px 30px">
    <button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #192338; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Authorize ₱500 &amp; start</button>
  </div>
</div>
</body>
</html>
